name: VELTRA Release (Signed AAB)

# Catatan:
# - Kalau secrets keystore belum diisi, workflow ini TETAP jalan dan menghasilkan AAB
#   yang belum di-tanda-tangani (unsigned) — berguna untuk testing.
# - Untuk rilis ke Play Store, isi 4 secrets di Settings → Secrets → Actions:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/veltra.jks"

      - name: Build AAB
        run: ./gradlew bundleRelease
        env:
          # Kosongkan path kalau keystore tidak tersedia → Gradle pakai konfigurasi unsigned
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/veltra.jks', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: veltra-release-aab
          path: app/build/outputs/bundle/release/*.aab

[versions]
agp = "8.5.2"
kotlin = "2.0.20"
composeCompiler = "2.0.20"
compose-bom = "2024.09.03"
hilt = "2.51.1"
ksp = "2.0.20-1.0.25"
coroutines = "1.8.1"
lifecycle = "2.8.6"
room = "2.6.1"
datastore = "1.1.1"
billing = "6.1.0"
lottie = "6.6.0"
playIntegrity = "1.3.0"
savedstate = "1.2.1"
navigation = "2.8.3"
